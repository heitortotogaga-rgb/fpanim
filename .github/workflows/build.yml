name: Build FPAnim
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Extrair projeto
        run: |
          echo "" | base64 -d > proj.zip
          unzip -q proj.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.3.3
          build-root-directory: fpanim
          arguments: build
      - uses: actions/upload-artifact@v4
        with:
          name: fpanim-jar
          path: fpanim/build/libs/*.jar
          
